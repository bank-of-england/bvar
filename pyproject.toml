[project]
name = "bvar"
version = "0.3.1"

description = "Bayesian Vector Autoregressions for forecasting"

keywords = ["bayesian", "forecasting", "macroeconomics", "var"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

authors = [
    {name="Paul Labonne", email="Paul.Labonne@bankofengland.co.uk"},
    {name="Andrea Renzetti", email="Andrea.Renzetti@bankofengland.co.uk"},
    {name="Joseph Oyegoke", email="Joseph.Oyegoke@bankofengland.co.uk"},
]

maintainers = [
    {name="Paul Labonne", email="paul.labonne@bankofengland.co.uk"},
    {name="Andrea Renzetti", email="Andrea.Renzetti@bankofengland.co.uk"},
]

license = "MIT"
license-files = ["LICENSE"]

readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "tqdm",
    "numba",
]

[project.urls]
Homepage = "https://github.com/bank-of-england/bvar"
Repository = "https://github.com/bank-of-england/bvar"
Issues = "https://github.com/bank-of-england/bvar/issues"
Documentation = "https://bank-of-england.github.io/bvar/"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pydoclint",
    "pyarrow",
    "ruff",
    "pytest",
    "pytest-xdist",
    "opera-eco[test]",
]

docs = [
    "zensical",
    "mkdocstrings[python]",
]

notebooks = [
    "marimo==0.24.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Exclude files and directories
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "notebooks",
    "notebooks/**",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py files

[tool.pytest.ini_options]
testpaths = ["tests"]
